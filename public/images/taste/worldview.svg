<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-worldview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180d2b"/><stop offset="1" stop-color="#2b1550"/>
    </linearGradient>
    <filter id="soft-worldview" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-worldview" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg-worldview)"/>
  <g filter="url(#soft-worldview)">
    <ellipse cx="327" cy="196" rx="104" ry="70" fill="#7c3aed" opacity="0.37" transform="rotate(164 327 196)"/>
    <ellipse cx="287" cy="272" rx="87" ry="160" fill="#fbbf24" opacity="0.42" transform="rotate(95 287 272)"/>
    <ellipse cx="47" cy="244" rx="171" ry="71" fill="#4a1f9c" opacity="0.54" transform="rotate(76 47 244)"/>
    <ellipse cx="327" cy="71" rx="167" ry="86" fill="#7c3aed" opacity="0.37" transform="rotate(65 327 71)"/>
    <ellipse cx="331" cy="308" rx="88" ry="126" fill="#fbbf24" opacity="0.58" transform="rotate(107 331 308)"/>
    <path d="M-40 91 C 144 48, 336 278, 520 91" fill="none" stroke="#fbbf24" stroke-width="25" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 245 C 144 187, 336 291, 520 245" fill="none" stroke="#4a1f9c" stroke-width="21" opacity="0.22" stroke-linecap="round"/>
  </g>
  <rect width="480" height="360" filter="url(#grain-worldview)" opacity="0.055"/>
</svg>
