<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-horror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08110d"/><stop offset="1" stop-color="#0f2018"/>
    </linearGradient>
    <filter id="soft-horror" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-horror" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg-horror)"/>
  <g filter="url(#soft-horror)">
    <ellipse cx="91" cy="301" rx="141" ry="131" fill="#2f7d5d" opacity="0.34" transform="rotate(23 91 301)"/>
    <ellipse cx="293" cy="183" rx="186" ry="135" fill="#6fd6a4" opacity="0.49" transform="rotate(145 293 183)"/>
    <ellipse cx="285" cy="171" rx="158" ry="79" fill="#123626" opacity="0.56" transform="rotate(57 285 171)"/>
    <ellipse cx="167" cy="284" rx="148" ry="86" fill="#2f7d5d" opacity="0.39" transform="rotate(106 167 284)"/>
    <ellipse cx="162" cy="161" rx="170" ry="65" fill="#6fd6a4" opacity="0.65" transform="rotate(147 162 161)"/>
    <path d="M-40 74 C 144 119, 336 137, 520 74" fill="none" stroke="#6fd6a4" stroke-width="27" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 216 C 144 252, 336 243, 520 216" fill="none" stroke="#123626" stroke-width="25" opacity="0.22" stroke-linecap="round"/>
  </g>
  <rect width="480" height="360" filter="url(#grain-horror)" opacity="0.055"/>
</svg>
