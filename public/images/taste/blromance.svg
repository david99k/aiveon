<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-blromance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1418"/><stop offset="1" stop-color="#452028"/>
    </linearGradient>
    <filter id="soft-blromance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
