    <ellipse cx="386" cy="324" rx="197" ry="113" fill="#6366f1" opacity="0.60" transform="rotate(21 386 324)"/>
    <ellipse cx="439" cy="79" rx="123" ry="98" fill="#ec4899" opacity="0.56" transform="rotate(13 439 79)"/>
    <path d="M-40 275 C 144 257, 336 65, 520 275" fill="none" stroke="#ec4899" stroke-width="31" opacity="0.22" stroke-linecap="round"/>
