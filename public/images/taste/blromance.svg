    <ellipse cx="142" cy="75" rx="178" ry="155" fill="#fecdd3" opacity="0.45" transform="rotate(119 142 75)"/>
    <path d="M-40 119 C 144 81, 336 76, 520 119" fill="none" stroke="#fecdd3" stroke-width="18" opacity="0.22" stroke-linecap="round"/>
