    <ellipse cx="344" cy="36" rx="193" ry="71" fill="#a78bfa" opacity="0.31" transform="rotate(78 344 36)"/>
    <ellipse cx="154" cy="275" rx="158" ry="142" fill="#f472b6" opacity="0.37" transform="rotate(30 154 275)"/>
    <path d="M-40 263 C 144 132, 336 154, 520 263" fill="none" stroke="#f472b6" stroke-width="41" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 161 C 144 210, 336 157, 520 161" fill="none" stroke="#5b3aa8" stroke-width="39" opacity="0.22" stroke-linecap="round"/>
