<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-thriller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <filter id="soft-thriller" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-thriller" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg-thriller)"/>
  <g filter="url(#soft-thriller)">
    <ellipse cx="170" cy="87" rx="158" ry="135" fill="#3d7fd6" opacity="0.63" transform="rotate(75 170 87)"/>
    <ellipse cx="158" cy="83" rx="141" ry="121" fill="#7fb2ff" opacity="0.62" transform="rotate(110 158 83)"/>
    <ellipse cx="228" cy="103" rx="114" ry="67" fill="#1b3a5c" opacity="0.35" transform="rotate(160 228 103)"/>
    <ellipse cx="376" cy="229" rx="80" ry="81" fill="#3d7fd6" opacity="0.49" transform="rotate(108 376 229)"/>
    <ellipse cx="352" cy="240" rx="156" ry="75" fill="#7fb2ff" opacity="0.64" transform="rotate(157 352 240)"/>
    <path d="M-40 83 C 144 237, 336 67, 520 83" fill="none" stroke="#7fb2ff" stroke-width="28" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 107 C 144 73, 336 268, 520 107" fill="none" stroke="#1b3a5c" stroke-width="27" opacity="0.22" stroke-linecap="round"/>
  </g>
  <rect width="480" height="360" filter="url(#grain-thriller)" opacity="0.055"/>
</svg>
