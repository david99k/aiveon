    <ellipse cx="348" cy="219" rx="102" ry="89" fill="#ef4444" opacity="0.33" transform="rotate(40 348 219)"/>
    <ellipse cx="303" cy="112" rx="77" ry="96" fill="#fb923c" opacity="0.30" transform="rotate(156 303 112)"/>
    <path d="M-40 136 C 144 258, 336 295, 520 136" fill="none" stroke="#fb923c" stroke-width="21" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 242 C 144 57, 336 96, 520 242" fill="none" stroke="#8a1c26" stroke-width="25" opacity="0.22" stroke-linecap="round"/>
