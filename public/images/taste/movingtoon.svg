<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-movingtoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150e2c"/><stop offset="1" stop-color="#241a4d"/>
    </linearGradient>
    <filter id="soft-movingtoon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-movingtoon" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg-movingtoon)"/>
  <g filter="url(#soft-movingtoon)">
    <ellipse cx="407" cy="227" rx="108" ry="72" fill="#8b5cf6" opacity="0.48" transform="rotate(89 407 227)"/>
    <ellipse cx="175" cy="41" rx="92" ry="132" fill="#c4b5fd" opacity="0.42" transform="rotate(104 175 41)"/>
    <ellipse cx="164" cy="171" rx="186" ry="161" fill="#4c2f9e" opacity="0.44" transform="rotate(43 164 171)"/>
    <ellipse cx="381" cy="134" rx="163" ry="86" fill="#8b5cf6" opacity="0.57" transform="rotate(150 381 134)"/>
    <ellipse cx="420" cy="141" rx="120" ry="162" fill="#c4b5fd" opacity="0.30" transform="rotate(5 420 141)"/>
    <path d="M-40 88 C 144 278, 336 217, 520 88" fill="none" stroke="#c4b5fd" stroke-width="21" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 121 C 144 44, 336 105, 520 121" fill="none" stroke="#4c2f9e" stroke-width="23" opacity="0.22" stroke-linecap="round"/>
  </g>
