<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-shorts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/><stop offset="1" stop-color="#2d1a52"/>
    </linearGradient>
    <filter id="soft-shorts" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-shorts" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
