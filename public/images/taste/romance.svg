<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <linearGradient id="bg-romance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1020"/><stop offset="1" stop-color="#4a1430"/>
    </linearGradient>
    <filter id="soft-romance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain-romance" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg-romance)"/>
  <g filter="url(#soft-romance)">
    <ellipse cx="203" cy="189" rx="97" ry="62" fill="#ff5f9e" opacity="0.34" transform="rotate(132 203 189)"/>
    <ellipse cx="179" cy="50" rx="118" ry="92" fill="#ffa8c5" opacity="0.57" transform="rotate(86 179 50)"/>
    <ellipse cx="58" cy="198" rx="154" ry="68" fill="#7b2d5e" opacity="0.36" transform="rotate(135 58 198)"/>
    <ellipse cx="97" cy="79" rx="169" ry="98" fill="#ff5f9e" opacity="0.65" transform="rotate(68 97 79)"/>
    <ellipse cx="149" cy="284" rx="189" ry="122" fill="#ffa8c5" opacity="0.39" transform="rotate(158 149 284)"/>
    <path d="M-40 77 C 144 50, 336 154, 520 77" fill="none" stroke="#ffa8c5" stroke-width="26" opacity="0.22" stroke-linecap="round"/>
    <path d="M-40 234 C 144 108, 336 130, 520 234" fill="none" stroke="#7b2d5e" stroke-width="20" opacity="0.22" stroke-linecap="round"/>
  </g>
  <rect width="480" height="360" filter="url(#grain-romance)" opacity="0.055"/>
</svg>
